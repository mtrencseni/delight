[package]
name = "delight"
version = "0.1.0"
description = "Delight Commander — a dual-pane file manager"
authors = ["Marton Trencseni"]
edition = "2021"

[lib]
name = "delight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# System file icons come from the platform's icon registry (NSWorkspace on macOS).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSData",
    "NSDictionary",
    "NSGeometry",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
    "NSGraphics",
] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
strip = true
