[package]
name = "delight"
version = "0.3.0"
description = "Delight Commander — a dual-pane file manager"
authors = ["Marton Trencseni"]
edition = "2021"

[lib]
name = "delight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
# The filesystem core, shared with delight-server. Everything this crate does
# beyond opening a window is a thin wrapper over it (see lib.rs).
delight-core = { path = "../core" }
# `devtools` keeps the WKWebView Web Inspector available in release builds
# (gated at runtime by the "Enable developer tools" setting).
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-drag = "2.1.1"
tauri-plugin-window-state = "2.4.1"

# The Web Inspector is reached through WKWebView's private _inspector (actions.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

