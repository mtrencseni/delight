[package]
name = "delight"
version = "0.1.0"
description = "Delight Commander — a dual-pane file manager"
authors = ["Marton Trencseni"]
edition = "2021"

[lib]
name = "delight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
# `devtools` keeps the WKWebView Web Inspector available in release builds
# (gated at runtime by the "Enable developer tools" setting).
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-drag = "2.1.1"
tauri-plugin-window-state = "2.4.1"
# Cross-platform "move to Trash/Recycle Bin" for the delete operation.
trash = "5"

# Owner name resolution (uid -> username) on Unix.
[target.'cfg(unix)'.dependencies]
uzers = "0.12"

# System file icons come from the platform's icon registry (NSWorkspace on macOS).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSData",
    "NSDictionary",
    "NSGeometry",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
    "NSGraphics",
] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
strip = true
