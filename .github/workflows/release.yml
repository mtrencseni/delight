# Build Delight and publish it to a GitHub Release.
#
# Fires on a version tag (v0.1.0 → release "Delight v0.1.0"), or by hand from the
# Actions tab for a dry run that builds and uploads artifacts without releasing.
# Windows and Linux build in parallel; the `release` job collects both.
#
# NOTE: Delight's frontend re-exports the shared editor + language registry from
# the Buffers repo (src/langs.ts, src/editor-core.ts point at ../../Buffers/src/…),
# so BOTH repos are checked out side by side. Buffers is private, and the built-in
# GITHUB_TOKEN only reaches the current repo, so the extra checkout needs a PAT in
# the BUFFERS_TOKEN secret — see .github/workflows/README.md.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Needed to create the release and upload assets.
permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - name: Check out Delight
        uses: actions/checkout@v7
        with:
          path: delight

      # Must sit next to delight/ and be spelled "Buffers": the shims import
      # ../../Buffers/src/… relative to delight/src/.
      - name: Check out Buffers (shared editor + language registry)
        uses: actions/checkout@v7
        with:
          repository: mtrencseni/buffers
          path: Buffers
          token: ${{ secrets.BUFFERS_TOKEN }}

      - name: Resolve version
        id: v
        shell: bash
        run: |
          conf=$(node -p "require('./delight/src-tauri/tauri.conf.json').version")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            # A tag that disagrees with the app's own version ships a binary that
            # reports the wrong number — fail loudly instead.
            if [[ "$tag" != "$conf" ]]; then
              echo "::error::Tag v$tag does not match tauri.conf.json version $conf"
              exit 1
            fi
            echo "version=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "version=$conf" >> "$GITHUB_OUTPUT"
          fi

      # Match the pnpm major that wrote pnpm-lock.yaml, so --frozen-lockfile
      # can't trip over a lockfile a newer pnpm produced.
      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            delight/pnpm-lock.yaml
            Buffers/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: delight/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: delight
        run: pnpm install --frozen-lockfile

      # Buffers' own node_modules, not Delight's. The shims pull real source out
      # of Buffers/src, and module resolution for those files walks up from
      # Buffers/ — it never reaches delight/node_modules — so CodeMirror has to
      # be installed on that side too or tsc can't resolve a single import.
      - name: Install Buffers dependencies
        working-directory: Buffers
        run: pnpm install --frozen-lockfile

      # --no-bundle skips the NSIS installer: we ship the standalone exe only.
      - name: Build
        working-directory: delight
        run: pnpm tauri build --no-bundle --target x86_64-pc-windows-msvc

      - name: Name the artifact
        id: art
        shell: bash
        run: |
          # Workspace root, NOT src-tauri/target: the Rust became a three-crate
          # workspace (core / server / src-tauri) in 0.3, and cargo puts the
          # shared target dir beside the workspace Cargo.toml. The build step
          # above succeeds either way, so getting this wrong fails here, after
          # the slowest part of the job has already run.
          src="delight/target/x86_64-pc-windows-msvc/release/delight.exe"
          if [[ ! -f "$src" ]]; then
            echo "::error::No exe at $src — did the target dir move again?"
            find delight -name delight.exe -path '*release*' | head
            exit 1
          fi
          name="Delight-${{ steps.v.outputs.version }}-win_x64-portable.exe"
          # A second, version-less copy. Release assets are addressable at
          # /releases/latest/download/<file>, which only works if the file name
          # is the same in every release — so the versioned copy is for
          # archives, and this one is what README links to.
          stable="Delight-win_x64-portable.exe"
          mkdir -p dist
          cp "$src" "dist/$name"
          cp "$src" "dist/$stable"
          (cd dist && sha256sum "$name" > "$name.sha256" && sha256sum "$stable" > "$stable.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -l dist

      # A copy attached to the run itself, so a dry run (which publishes no
      # release) still leaves something downloadable. Short retention: this is a
      # scratch copy, the release assets are the ones that are kept.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.art.outputs.name }}
          path: dist/*
          retention-days: 7

  linux-x64:
    # The oldest LTS the runners offer: an AppImage carries its own libraries
    # but not glibc, so building on the oldest base runs on the most machines.
    runs-on: ubuntu-22.04

    steps:
      - name: Check out Delight
        uses: actions/checkout@v7
        with:
          path: delight

      - name: Check out Buffers (shared editor + language registry)
        uses: actions/checkout@v7
        with:
          repository: mtrencseni/buffers
          path: Buffers
          token: ${{ secrets.BUFFERS_TOKEN }}

      - name: Resolve version
        id: v
        run: |
          conf=$(node -p "require('./delight/src-tauri/tauri.conf.json').version")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$tag" != "$conf" ]]; then
              echo "::error::Tag v$tag does not match tauri.conf.json version $conf"
              exit 1
            fi
            echo "version=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "version=$conf" >> "$GITHUB_OUTPUT"
          fi

      # Tauri's documented WebKitGTK toolchain for Ubuntu 22.04.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            delight/pnpm-lock.yaml
            Buffers/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: delight -> target

      - name: Install frontend dependencies
        working-directory: delight
        run: pnpm install --frozen-lockfile

      - name: Install Buffers dependencies
        working-directory: Buffers
        run: pnpm install --frozen-lockfile

      # tauri.linux.conf.json picks the targets: a .deb and a portable AppImage.
      - name: Build
        working-directory: delight
        run: pnpm tauri build

      - name: Name the artifacts
        id: art
        run: |
          v="${{ steps.v.outputs.version }}"
          mkdir -p dist
          deb=$(ls delight/target/release/bundle/deb/*.deb)
          app=$(ls delight/target/release/bundle/appimage/*.AppImage)
          # Versioned copy for the archive, stable name for the README's
          # /releases/latest/download/… links (same scheme as the exe).
          cp "$deb" "dist/Delight-$v-linux_x64.deb";     cp "$deb" dist/Delight-linux_x64.deb
          cp "$app" "dist/Delight-$v-linux_x64.AppImage"; cp "$app" dist/Delight-linux_x64.AppImage
          (cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done)
          echo "name=Delight-$v-linux_x64" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.art.outputs.name }}
          path: dist/*
          retention-days: 7

  # One job creates the release, after every build has uploaded its files —
  # two jobs racing softprops/action-gh-release on the same tag can end up with
  # two draft releases.
  release:
    needs: [windows-x64, linux-x64]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: Delight ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: dist/*
